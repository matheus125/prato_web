<style>
  .campo-obrigatorio::after {
    content: " *";
    color: #dc3545;
    font-weight: 700;
  }

  .socio-form-card {
    border-radius: 12px;
    overflow: hidden;
  }
</style>

<div class="card card-info card-outline mb-4 socio-form-card">
  <div class="card-header d-flex justify-content-between align-items-center flex-wrap gap-2">
    <h3 class="card-title text-info mb-0">
      <i class="bi bi-clipboard-data"></i> {$formTitle}
    </h3>
    <a href="/admin/socio-economico" class="btn btn-outline-secondary btn-sm">
      <i class="bi bi-arrow-left me-1"></i> Voltar
    </a>
  </div>

  <div class="card-body pb-0">
    {if="$msgSuccess != ''"}
    <div class="alert alert-success alert-dismissible fade show" role="alert">
      {$msgSuccess}
      <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
    {/if}

    {if="$msgError != ''"}
    <div class="alert alert-danger alert-dismissible fade show" role="alert">
      {$msgError}
      <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
    {/if}
  </div>

  <form action="{$formAction}" method="post" class="needs-validation" novalidate>
    <input type="hidden" name="id" value="{$registro.id}">

    <div class="card-body">
      <div class="row g-3">
        <div class="col-12">
          <h5 class="text-info border-bottom pb-2">
            <i class="bi bi-person"></i> Titular
          </h5>
        </div>

        <div class="col-md-8">
          <label class="form-label campo-obrigatorio">Titular</label>
          <select class="form-select form-select-sm" name="id_titular" required>
            <option value="">Selecione</option>
            {loop="$titulares"}
            <option value="{$value.id}" {if="$value.id == $registro.id_titular"}selected{/if}>
              {$value.nome_completo} - {$value.cpf}
            </option>
            {/loop}
          </select>
          <div class="invalid-feedback">Selecione um titular.</div>
        </div>

        <div class="col-md-4">
          <label class="form-label">Escolariedade</label>
          <select class="form-select form-select-sm" name="escolariedade">
            <option value="">Selecione</option>
            <option value="Sem escolaridade" {if="$registro.escolariedade == 'Sem escolaridade'"}selected{/if}>Sem escolaridade</option>
            <option value="Fundamental incompleto" {if="$registro.escolariedade == 'Fundamental incompleto'"}selected{/if}>Fundamental incompleto</option>
            <option value="Fundamental completo" {if="$registro.escolariedade == 'Fundamental completo'"}selected{/if}>Fundamental completo</option>
            <option value="Medio incompleto" {if="$registro.escolariedade == 'Medio incompleto'"}selected{/if}>Medio incompleto</option>
            <option value="Medio completo" {if="$registro.escolariedade == 'Medio completo'"}selected{/if}>Medio completo</option>
            <option value="Superior incompleto" {if="$registro.escolariedade == 'Superior incompleto'"}selected{/if}>Superior incompleto</option>
            <option value="Superior completo" {if="$registro.escolariedade == 'Superior completo'"}selected{/if}>Superior completo</option>
          </select>
        </div>

        <div class="col-12 mt-3">
          <h5 class="text-info border-bottom pb-2">
            <i class="bi bi-cash-coin"></i> Renda e familia
          </h5>
        </div>

        <div class="col-md-3">
          <label class="form-label">Renda mensal familia</label>
          <input type="text" class="form-control form-control-sm" name="renda_mensal_familia"
            value="{$registro.renda_mensal_familia}">
        </div>

        <div class="col-md-3">
          <label class="form-label">Programas sociais</label>
          <input type="text" class="form-control form-control-sm" name="programas_sociais"
            value="{$registro.programas_sociais}">
        </div>

        <div class="col-md-3">
          <label class="form-label">Composicao familiar</label>
          <input type="text" class="form-control form-control-sm" name="composicao_familiar"
            value="{$registro.composicao_familiar}">
        </div>

        <div class="col-md-3">
          <label class="form-label">Pessoas trabalhando</label>
          <input type="number" min="0" class="form-control form-control-sm" name="qtdPessoas_Trabalhando"
            value="{$registro.qtdPessoas_Trabalhando}">
        </div>

        <div class="col-md-3">
          <label class="form-label">Emprego</label>
          <select class="form-select form-select-sm" name="emprego">
            <option value="">Selecione</option>
            <option value="Sim" {if="$registro.emprego == 'Sim'"}selected{/if}>Sim</option>
            <option value="Nao" {if="$registro.emprego == 'Nao'"}selected{/if}>Nao</option>
            <option value="Eventual" {if="$registro.emprego == 'Eventual'"}selected{/if}>Eventual</option>
          </select>
        </div>

        <div class="col-md-5">
          <label class="form-label">Profissao responsavel</label>
          <input type="text" class="form-control form-control-sm" name="profissao_Responsavel"
            value="{$registro.profissao_Responsavel}">
        </div>

        <div class="col-12 mt-3">
          <h5 class="text-info border-bottom pb-2">
            <i class="bi bi-house"></i> Moradia e servicos
          </h5>
        </div>

        <div class="col-md-3">
          <label class="form-label">Moradia</label>
          <select class="form-select form-select-sm" name="moradia">
            <option value="">Selecione</option>
            <option value="Propria" {if="$registro.moradia == 'Propria'"}selected{/if}>Propria</option>
            <option value="Alugada" {if="$registro.moradia == 'Alugada'"}selected{/if}>Alugada</option>
            <option value="Cedida" {if="$registro.moradia == 'Cedida'"}selected{/if}>Cedida</option>
            <option value="Situacao de rua" {if="$registro.moradia == 'Situacao de rua'"}selected{/if}>Situacao de rua</option>
            <option value="Outra" {if="$registro.moradia == 'Outra'"}selected{/if}>Outra</option>
          </select>
        </div>

        <div class="col-md-3">
          <label class="form-label">Estrutura moradia</label>
          <select class="form-select form-select-sm" name="estrutura_Moradia">
            <option value="">Selecione</option>
            <option value="Alvenaria" {if="$registro.estrutura_Moradia == 'Alvenaria'"}selected{/if}>Alvenaria</option>
            <option value="Madeira" {if="$registro.estrutura_Moradia == 'Madeira'"}selected{/if}>Madeira</option>
            <option value="Mista" {if="$registro.estrutura_Moradia == 'Mista'"}selected{/if}>Mista</option>
            <option value="Lona" {if="$registro.estrutura_Moradia == 'Lona'"}selected{/if}>Lona</option>
            <option value="Outra" {if="$registro.estrutura_Moradia == 'Outra'"}selected{/if}>Outra</option>
          </select>
        </div>

        <div class="col-md-2">
          <label class="form-label">Agua</label>
          <select class="form-select form-select-sm" name="AB_Agua">
            <option value="">Selecione</option>
            <option value="Sim" {if="$registro.AB_Agua == 'Sim'"}selected{/if}>Sim</option>
            <option value="Nao" {if="$registro.AB_Agua == 'Nao'"}selected{/if}>Nao</option>
          </select>
        </div>

        <div class="col-md-2">
          <label class="form-label">Saneamento</label>
          <select class="form-select form-select-sm" name="SN_basico">
            <option value="">Selecione</option>
            <option value="Sim" {if="$registro.SN_basico == 'Sim'"}selected{/if}>Sim</option>
            <option value="Nao" {if="$registro.SN_basico == 'Nao'"}selected{/if}>Nao</option>
          </select>
        </div>

        <div class="col-md-2">
          <label class="form-label">Energia</label>
          <select class="form-select form-select-sm" name="Energia_eletrica">
            <option value="">Selecione</option>
            <option value="Sim" {if="$registro.Energia_eletrica == 'Sim'"}selected{/if}>Sim</option>
            <option value="Nao" {if="$registro.Energia_eletrica == 'Nao'"}selected{/if}>Nao</option>
          </select>
        </div>

        <div class="col-md-3">
          <label class="form-label">Lixo domiciliar</label>
          <select class="form-select form-select-sm" name="Lixo_Domiciliar">
            <option value="">Selecione</option>
            <option value="Sim" {if="$registro.Lixo_Domiciliar == 'Sim'"}selected{/if}>Sim</option>
            <option value="Nao" {if="$registro.Lixo_Domiciliar == 'Nao'"}selected{/if}>Nao</option>
            <option value="Coleta publica" {if="$registro.Lixo_Domiciliar == 'Coleta publica'"}selected{/if}>Coleta publica</option>
            <option value="Queima" {if="$registro.Lixo_Domiciliar == 'Queima'"}selected{/if}>Queima</option>
            <option value="Outro" {if="$registro.Lixo_Domiciliar == 'Outro'"}selected{/if}>Outro</option>
          </select>
        </div>

        <div class="col-md-3">
          <label class="form-label">Frequenta centro</label>
          <select class="form-select form-select-sm" name="frequenta_Centro">
            <option value="">Selecione</option>
            <option value="Sim" {if="$registro.frequenta_Centro == 'Sim'"}selected{/if}>Sim</option>
            <option value="Nao" {if="$registro.frequenta_Centro == 'Nao'"}selected{/if}>Nao</option>
          </select>
        </div>
      </div>
    </div>

    <div class="card-footer d-flex gap-2 justify-content-end">
      <a href="/admin/socio-economico" class="btn btn-secondary btn-sm">
        <i class="bi bi-x-circle me-1"></i> Cancelar
      </a>
      <button type="submit" class="btn btn-primary btn-sm">
        <i class="bi bi-check-circle me-1"></i> {$buttonText}
      </button>
    </div>
  </form>
</div>

<script>
  (function () {
    const forms = document.querySelectorAll('.needs-validation');
    forms.forEach(function (form) {
      form.addEventListener('submit', function (event) {
        if (!form.checkValidity()) {
          event.preventDefault();
          event.stopPropagation();
        }

        form.classList.add('was-validated');
      }, false);
    });
  })();
</script>
